name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu proves the parsers are pure and portable, which is what makes
        # the eventual C# port straightforward. windows is the platform the
        # engine actually ships on, so it is the one that must stay green.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
          key: psmodules-${{ runner.os }}-pester6

      - name: Install Pester
        shell: pwsh
        run: |
          $existing = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version -ge [version]'6.0.0' } |
            Sort-Object Version -Descending | Select-Object -First 1
          if ($existing) {
            "Pester $($existing.Version) already present"
          } else {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 6.0.0
          }

      - name: Syntax check every script
        shell: pwsh
        run: |
          # The PowerShell parser is the first thing that runs on the target
          # machine too. A parse error here means the dashboard never opens -
          # exactly the failure mode of PR #7.
          $bad = 0
          Get-ChildItem -Path ./tools, ./legacy, ./deploy -Filter *.ps1 -File | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count -gt 0) {
              $bad++
              Write-Host "::error file=$($_.Name)::$($errs.Count) parse error(s)"
              $errs | ForEach-Object {
                Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Run Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path        = './tests'
          $cfg.Run.Exit        = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled      = $true
          $cfg.TestResult.OutputPath   = 'testresults.xml'
          $cfg.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $cfg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}
          path: testresults.xml
          if-no-files-found: warn

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DmarcMonitor.sln

      # Warnings are errors in Directory.Build.props. The point of moving off
      # PowerShell is that a whole class of bug fails the build rather than
      # surviving to be found by a test somebody remembered to write.
      - name: Build
        run: dotnet build src/DmarcMonitor.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/DmarcMonitor.sln --no-build --configuration Release --verbosity normal

      # A dependency with a published advisory is a finding whether or not the
      # code here calls into it, and "it is only in the test projects" stops
      # being an answer the moment somebody fills in a security questionnaire.
      # This found two High advisories reaching the test projects through an
      # old Microsoft.NET.Test.Sdk, which is exactly the kind of thing nobody
      # goes looking for on purpose.
      #
      # --include-transitive because the direct references were never the
      # problem: what ships is resolved, not what is written down.
      #
      # dotnet exits 0 whatever it finds, so the output is what decides - and
      # set -o pipefail so `dotnet` itself failing is not swallowed by tee.
      # Without it a restore error leaves audit.txt empty, the grep finds
      # nothing, and the gate reports "No known advisories" having in fact
      # checked nothing at all.
      - name: Vulnerable dependencies
        run: |
          set -o pipefail
          dotnet list src/DmarcMonitor.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -qiE '^\s*>' audit.txt; then
            echo "::error::A dependency has a published advisory. See the table above."
            exit 1
          fi
          echo "No known advisories."

      # Separate step, and deliberately not failing the build. A package that
      # is deprecated is a thing to plan for, not a thing to stop a release at
      # four in the morning.
      - name: Deprecated dependencies
        continue-on-error: true
        run: dotnet list src/DmarcMonitor.sln package --deprecated --include-transitive

  install:
    name: Install on a fresh Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Lint the deploy scripts and units
        run: |
          shellcheck -S warning deploy/*.sh
          for f in deploy/*.sh; do bash -n "$f"; done

          # The distro packages put the runtime at /usr/bin/dotnet, which is
          # what the units name; setup-dotnet puts it somewhere else. Same
          # layout as the packages, so the units are verified as shipped.
          sudo ln -sf "$(command -v dotnet)" /usr/bin/dotnet

          # verify insists the executables exist. The agent's is installed by
          # install-update-agent.sh, which runs later; a stub stands in.
          sudo install -D -m 0755 /bin/true /opt/dmarc/deploy/update-agent.sh
          sudo install -D -m 0755 /bin/true /usr/local/bin/dmarc
          systemd-analyze verify --man=no deploy/*.service deploy/*.timer deploy/*.path
          sudo rm -rf /opt/dmarc /usr/local/bin/dmarc

      - name: Build the two release artifacts
        run: |
          # The same two files release.yml attaches, built the same way.
          dotnet publish src/DmarcMonitor.Cli/DmarcMonitor.Cli.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            --output publish/cli
          dotnet publish src/DmarcMonitor.Web/DmarcMonitor.Web.csproj \
            --configuration Release --output publish/dmarc-web
          (cd publish && zip -qr ../dmarc-web.zip dmarc-web)
          cp publish/cli/dmarc dmarc-linux-x64

      - name: Install from nothing
        run: sudo ./deploy/install.sh --web dmarc-web.zip --cli dmarc-linux-x64

      - name: The service is up, sandboxed, and answers the way the docs say
        run: |
          systemctl is-active dmarc-web
          systemctl show dmarc-web -p User -p ProtectSystem -p ProtectHome -p ReadWritePaths

          # Local trial mode: a loopback request is served (redirected to the
          # local sign-in), a proxied one is refused. Both from the same port.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/)
          echo "loopback: $code"; [[ "$code" =~ ^(200|302)$ ]]
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 203.0.113.9' http://127.0.0.1:5000/)
          echo "proxied:  $code"; test "$code" = 403

          # Signing in mints a cookie key. It must land beside the database,
          # because the unit hides the home directory: a key that went there
          # would exist only in memory, and every restart would sign everybody
          # out.
          curl -s -o /dev/null http://127.0.0.1:5000/local-signin
          sudo ls /opt/dmarc/data/keys/ | grep -q '^key-.*\.xml$'
          sudo test ! -e /opt/dmarc/.aspnet

          # The service account can run the command the timer will run.
          sudo -u dmarc dmarc version
          sudo -u dmarc ls /opt/dmarc/data/.net >/dev/null

          # It never overwrites configuration, and it never runs twice.
          test "$(sudo stat -c '%a %U' /opt/dmarc/app/appsettings.Production.json)" = "600 dmarc"
          test "$(sudo stat -c '%a %U' /etc/dmarc-ingest.env)" = "600 root"
          if sudo ./deploy/install.sh --web dmarc-web.zip --cli dmarc-linux-x64; then
            echo "install.sh ran over an existing install"; exit 1
          fi

      # Everything from here to the update agent is about the four scheduled
      # jobs install.sh switches on. Until now CI checked that the unit FILES
      # parsed and that the web app answered; nothing checked that the timers
      # were actually enabled, and dmarc-backup and dmarc-health had never run
      # on a machine at all - only their logic, against temporary directories,
      # in unit tests.
      #
      # That is the gap worth closing. These two run unattended, as the
      # service account, inside ProtectSystem=strict with a literal
      # ReadWritePaths= list. A path that is right in the unit file and wrong
      # on disk passes every test in the solution and fails at 03:20 into a
      # journal nobody reads until the day they need a restore.
      - name: Every scheduled job the install promised is switched on
        run: |
          for t in dmarc-dns.timer dmarc-prune.timer dmarc-backup.timer dmarc-health.timer; do
            printf '%-20s %s %s\n' "$t" "$(systemctl is-enabled "$t")" "$(systemctl is-active "$t")"
            test "$(systemctl is-enabled "$t")" = enabled
            test "$(systemctl is-active "$t")"  = active
          done

          # And the collector deliberately is not: it cannot run until somebody
          # supplies a certificate and a mailbox, and an hourly unit failing on
          # an empty environment file teaches an operator to ignore it.
          # is-enabled exits non-zero for a disabled unit, hence the guard.
          state=$(systemctl is-enabled dmarc-ingest.timer || true)
          echo "dmarc-ingest.timer $state"; test "$state" = disabled

          systemctl list-timers --all 'dmarc-*' --no-pager

      - name: The backup runs, under the sandbox it will run under every night
        run: |
          # install.sh takes the first one, so there is a copy before the
          # health check below is ever asked. Its permissions matter as much
          # as its existence: the live database is 0600, and a backup readable
          # by every account on the machine is a copy of every customer's mail
          # data sitting at 0644.
          sudo ls -la /opt/dmarc/backups
          first=$(sudo sh -c 'ls -1 /opt/dmarc/backups/dmarc-*.bak' | head -1)
          test -n "$first"
          echo "first backup: $first"
          test "$(sudo stat -c '%a %U' "$first")"       = "600 dmarc"
          test "$(sudo stat -c '%a %U' /opt/dmarc/backups)" = "700 dmarc"

          # A second, started the way the timer starts it. The name carries a
          # timestamp to the second, so this cannot collide with the one the
          # install took minutes ago.
          sudo systemctl start dmarc-backup
          sudo journalctl -u dmarc-backup -n 30 --no-pager
          test "$(systemctl show dmarc-backup -p Result --value)" = success
          count=$(sudo sh -c 'ls -1 /opt/dmarc/backups/dmarc-*.bak' | wc -l)
          echo "$count backup(s) held"; test "$count" -ge 2

          # The copy is a real database, not a truncated file that happens to
          # exist - which is the failure a backup has when nobody checks.
          # Copied out under this account, because a root-owned 0600 file is
          # one sqlite3 here cannot open and the point is to open it.
          sudo install -m 0644 -o "$(id -un)" -g "$(id -gn)" "$first" /tmp/restore-check.db
          test "$(sqlite3 /tmp/restore-check.db 'PRAGMA integrity_check;')" = ok
          sqlite3 /tmp/restore-check.db "SELECT count(*) FROM aggregate_reports;"
          rm -f /tmp/restore-check.db

      - name: The health check runs, and is green on a fresh install
        run: |
          sudo systemctl start dmarc-health
          sudo journalctl -u dmarc-health -n 30 --no-pager
          test "$(systemctl show dmarc-health -p Result --value)" = success

          # And silent, which is the contract of the --quiet in its ExecStart:
          # a twice-daily check that writes something on a good day is one
          # that gets muted, and then the broken day arrives into a muted
          # channel. Findings are printed as "  [BROKEN] ..." / "  [check ]
          # ...", so the absence of that shape is the absence of findings.
          test -z "$(sudo journalctl -u dmarc-health -n 20 --no-pager -o cat | grep -E '^ *\[')"

          # Green because there is nothing wrong, and it says so when asked
          # without --quiet. Run separately rather than through a pipe, so a
          # non-zero exit is not swallowed by tee.
          sudo -u dmarc dmarc health --db /opt/dmarc/data/dmarc.db --backups /opt/dmarc/backups > health.out
          cat health.out
          grep -q 'Nothing wrong' health.out

      - name: It is green because it looked, and a failure raises an alert
        run: |
          # A check that is always green is indistinguishable from a check
          # that is not running. So: point it at a directory with no backups
          # in it - the one fault a fresh install can be made to have - and it
          # must fail, say why, and start the alert unit.
          sudo install -d -o dmarc -g dmarc -m 0700 /opt/dmarc/data/no-backups-here
          sudo mkdir -p /etc/systemd/system/dmarc-health.service.d
          printf '[Service]\nEnvironment=DMARC_BACKUP_DIR=/opt/dmarc/data/no-backups-here\n' \
            | sudo tee /etc/systemd/system/dmarc-health.service.d/ci-no-backups.conf >/dev/null
          sudo systemctl daemon-reload

          if sudo systemctl start dmarc-health; then
            echo "::error::dmarc-health passed with no backups at all"; exit 1
          fi
          test "$(systemctl is-failed dmarc-health)" = failed
          sudo journalctl -u dmarc-health -n 30 --no-pager
          sudo journalctl -u dmarc-health --no-pager \
            | grep -q 'There are no backups in /opt/dmarc/data/no-backups-here'

          # OnFailure= starts the alert asynchronously, so wait for it rather
          # than race it. The unit is dmarc-alert@dmarc-health.service: %N in
          # the OnFailure= line, so the instance is the failing unit's name
          # without its suffix.
          for _ in $(seq 1 30); do
            sudo journalctl -u 'dmarc-alert@dmarc-health.service' --no-pager 2>/dev/null \
              | grep -q 'ALERT: dmarc-health failed' && break
            sleep 1
          done
          sudo journalctl -u 'dmarc-alert@dmarc-health.service' -n 20 --no-pager
          sudo journalctl -u 'dmarc-alert@dmarc-health.service' --no-pager \
            | grep -q 'ALERT: dmarc-health failed'

          # Put it back, and prove the failure was the missing backups and not
          # something this step broke on the way past.
          sudo rm -rf /etc/systemd/system/dmarc-health.service.d
          sudo systemctl daemon-reload
          sudo systemctl reset-failed dmarc-health 'dmarc-alert@dmarc-health.service'
          sudo systemctl start dmarc-health
          test "$(systemctl is-failed dmarc-health || true)" != failed

      - name: A second mailbox collects under its own organization
        run: |
          # The templated unit is how an install collecting for more than one
          # organization runs, which is the shape this is actually deployed
          # in. It is installed but never enabled, so nothing here had ever
          # instantiated it - and a template that lost its %i installs
          # perfectly and only fails the day somebody adds a second mailbox.
          mkdir -p /tmp/ci-cert
          password=$(openssl rand -base64 24)
          openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes \
            -subj "/CN=CI ingest" -keyout /tmp/ci-cert/k.pem -out /tmp/ci-cert/c.pem 2>/dev/null
          ( umask 077 && CERT_PASSWORD="$password" openssl pkcs12 -export \
              -inkey /tmp/ci-cert/k.pem -in /tmp/ci-cert/c.pem \
              -out /tmp/ci-cert/ingest.pfx -passout env:CERT_PASSWORD )
          sudo install -o dmarc -g dmarc -m 0600 /tmp/ci-cert/ingest.pfx /opt/dmarc/data/ingest-nrg.pfx

          { printf 'DMARC_MAILBOX=dmarc@example.com\n'
            printf 'DMARC_TENANT_ID=11111111-2222-3333-4444-555555555555\n'
            printf 'DMARC_CLIENT_ID=22222222-3333-4444-5555-666666666666\n'
            printf 'DMARC_CERT_PATH=/opt/dmarc/data/ingest-nrg.pfx\n'
            printf 'DMARC_CERT_PASSWORD="%s"\n' "$password"
            printf 'DMARC_ORGANIZATION=nrg\n'
          } | sudo tee /etc/dmarc-ingest-nrg.env >/dev/null
          sudo chmod 0600 /etc/dmarc-ingest-nrg.env

          # It reads its own environment file, loads its own certificate and
          # gets as far as authenticating against a tenant that does not
          # exist - which is everything this side of the network. Exit 77, so
          # the unit ends failed, and that is the expected outcome here.
          set +e
          sudo systemctl start dmarc-ingest@nrg
          set -e
          sudo journalctl -u 'dmarc-ingest@nrg.service' -n 40 --no-pager | tee ingest-nrg.out

          # The instance name reached the description, the environment file and
          # --org. The last is the one that matters: a mailbox collected under
          # the wrong organization files a customer's domains into somebody
          # else's book and says nothing.
          grep -q 'Collect DMARC reports for nrg' ingest-nrg.out
          grep -q "Filing new domains under the organization 'nrg'" ingest-nrg.out
          grep -q 'Could not authenticate to Microsoft Entra' ingest-nrg.out

          sudo systemctl reset-failed 'dmarc-ingest@nrg.service'
          sudo rm -f /etc/dmarc-ingest-nrg.env /opt/dmarc/data/ingest-nrg.pfx
          rm -rf /tmp/ci-cert

      - name: An export is written readable by nobody else
        run: |
          # A complete dump of every customer's mail data. Written with the
          # ordinary umask it lands 0644 - weaker than the database it was
          # read from - so the command sets the mode as it creates the file.
          sudo -u dmarc dmarc export --db /opt/dmarc/data/dmarc.db --out /tmp/ci-export.ndjson
          test "$(stat -c '%a %U' /tmp/ci-export.ndjson)" = "600 dmarc"

          # And again over the file that now exists, because UnixCreateMode
          # applies only when a file is created: a second export over a
          # world-readable file used to leave it world-readable.
          sudo chmod 0644 /tmp/ci-export.ndjson
          sudo -u dmarc dmarc export --db /opt/dmarc/data/dmarc.db --out /tmp/ci-export.ndjson
          test "$(stat -c '%a %U' /tmp/ci-export.ndjson)" = "600 dmarc"
          sudo rm -f /tmp/ci-export.ndjson

      - name: The update agent's path unit wakes and refuses a bogus request
        run: |
          # OPEN-ISSUES.md said no systemd path unit had ever woken. This is
          # the wake: a request the agent must refuse, written the way the app
          # writes one, and the status the agent leaves behind.
          sudo ./deploy/install-update-agent.sh
          systemctl is-active dmarc-update.path

          echo '{"Version":"../../etc/passwd","RequestedBy":"ci"}' \
            | sudo -u dmarc tee /opt/dmarc/data/updates/requested.json >/dev/null
          for _ in $(seq 1 30); do
            sudo test -f /opt/dmarc/data/updates/status.json && break
            sleep 1
          done
          sudo cat /opt/dmarc/data/updates/status.json
          sudo grep -q '"State": "Failed"' /opt/dmarc/data/updates/status.json
          sudo grep -q 'not a version number' /opt/dmarc/data/updates/status.json
          sudo test ! -e /opt/dmarc/data/updates/requested.json
          sudo journalctl -u dmarc-update -n 20 --no-pager

      - name: Rolling back to a stamp that was never kept is refused
        run: |
          set +e
          sudo ./deploy/rollback.sh 19700101-000000
          code=$?
          set -e
          echo "exit $code"; test "$code" = 66
          systemctl is-active dmarc-web

      - name: What the service logged
        if: always()
        run: sudo journalctl -u dmarc-web -n 40 --no-pager || true

  # ARM was the one architecture that shipped without ever being executed.
  # The release cross-compiled linux-arm64 from an x64 runner and checked the
  # binary's ELF header and its size, which is not the same as knowing it
  # starts - and docs/AWS.md recommended an ARM instance, so the recommended
  # instance was the untested one.
  #
  # GitHub's arm64 runners are free for public repositories, so there is no
  # longer a reason for that to be true. This is the whole install, on the
  # architecture, on every pull request.
  install-arm64:
    name: Install on a fresh Ubuntu (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: The tools install.sh asks for
        run: |
          # Named rather than assumed. The arm64 image is a smaller build than
          # ubuntu-latest and a tool that happens to be on one is not a thing
          # to rely on being on the other.
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip sqlite3 curl python3 file

          # The units name /usr/bin/dotnet, which is where the distro packages
          # put it; setup-dotnet puts it elsewhere. Same layout as the
          # packages, so the units are exercised as shipped.
          sudo ln -sf "$(command -v dotnet)" /usr/bin/dotnet
          dotnet --list-runtimes | grep '^Microsoft.AspNetCore.App 8\.'

      - name: Build the release artifacts for this machine
        run: |
          dotnet publish src/DmarcMonitor.Cli/DmarcMonitor.Cli.csproj \
            --configuration Release --runtime linux-arm64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            --output publish/cli
          dotnet publish src/DmarcMonitor.Web/DmarcMonitor.Web.csproj \
            --configuration Release --output publish/dmarc-web
          (cd publish && zip -qr ../dmarc-web.zip dmarc-web)
          cp publish/cli/dmarc dmarc-linux-arm64

          # Built here, natively - so this also proves the runner is the
          # machine it claims to be and the RID was not quietly ignored.
          file dmarc-linux-arm64
          file dmarc-linux-arm64 | grep -q 'ARM aarch64'
          test "$(uname -m)" = aarch64

      - name: The binary runs with nothing beside it
        run: |
          # The release's own smoke test, finally executed for this
          # architecture: an empty directory, no checkout, no schema file, no
          # native SQLite library - and it must still create a database.
          mkdir -p smoke && cp dmarc-linux-arm64 smoke/
          (cd smoke && ./dmarc-linux-arm64 init-db --db proof.db && test -f proof.db)
          ./smoke/dmarc-linux-arm64 explain src/DmarcMonitor.Core.Tests/Fixtures/google-aggregate.xml

      - name: Install from nothing
        run: sudo ./deploy/install.sh --web dmarc-web.zip --cli dmarc-linux-arm64

      - name: The service answers and every scheduled job runs
        run: |
          systemctl is-active dmarc-web
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/)
          echo "loopback: $code"; [[ "$code" =~ ^(200|302)$ ]]

          for t in dmarc-dns.timer dmarc-prune.timer dmarc-backup.timer dmarc-health.timer; do
            printf '%-20s %s %s\n' "$t" "$(systemctl is-enabled "$t")" "$(systemctl is-active "$t")"
            test "$(systemctl is-enabled "$t")" = enabled
            test "$(systemctl is-active "$t")"  = active
          done

          # The install took a backup, and this asserts it rather than saying
          # so: a bare `ls` exits 0 on an empty directory, and install.sh's
          # first-backup block is deliberately non-fatal, so both of its
          # failure paths print to stderr and let the install finish. Without
          # a check here the health check below would be green because of the
          # backup THIS step takes, not the install's.
          sudo sh -c 'ls -la /opt/dmarc/backups'
          test "$(sudo sh -c 'ls -1 /opt/dmarc/backups/dmarc-*.bak' | wc -l)" -ge 1

          # Both run as the service account inside ProtectSystem=strict, and
          # both unpack the single-file binary's native libraries first -
          # which is the step that fails on an architecture nobody ran.
          sudo systemctl start dmarc-backup
          sudo systemctl start dmarc-health
          sudo journalctl -u dmarc-backup -u dmarc-health -n 40 --no-pager
          test "$(systemctl is-failed dmarc-backup || true)" != failed
          test "$(systemctl is-failed dmarc-health || true)" != failed
          sudo -u dmarc dmarc version

      - name: What the service logged
        if: always()
        run: sudo journalctl -u dmarc-web -n 40 --no-pager || true

  bootstrap-linux:
    name: One command on a fresh Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the release artifacts the way release.yml does
        run: |
          dotnet publish src/DmarcMonitor.Cli/DmarcMonitor.Cli.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            --output publish/cli
          dotnet publish src/DmarcMonitor.Web/DmarcMonitor.Web.csproj \
            --configuration Release --output publish/dmarc-web
          (cd publish && zip -qr ../dmarc-web.zip dmarc-web)
          cp publish/cli/dmarc dmarc-linux-x64
          # The distro package puts the runtime at /usr/bin/dotnet, which is
          # what the unit names and what bootstrap finds under sudo's PATH.
          # setup-dotnet puts it elsewhere; this stands in for the package.
          sudo ln -sf "$(command -v dotnet)" /usr/bin/dotnet

      - name: One command, from nothing
        run: |
          # Everything at once: Caddy on localhost (its internal CA, so no
          # public DNS is needed), Entra sign-in against the "common" tenant
          # (real metadata, so the redirect is built for real), and the
          # collector with a certificate the script makes.
          sudo ./deploy/bootstrap.sh --from-dir . --host localhost --email ci@example.com \
            --provider-name CI --tenant-id common --client-id 00000000-0000-0000-0000-000000000000 \
            --make-ingest-cert --mailbox dmarc@example.com \
            --ingest-tenant-id 11111111-2222-3333-4444-555555555555 \
            --ingest-client-id 22222222-3333-4444-5555-666666666666

      - name: Everything it promised is true
        run: |
          systemctl is-active dmarc-web caddy dmarc-ingest.timer dmarc-update.path
          sudo journalctl -u dmarc-web -n 30 --no-pager | grep -q 'Sign-in: Microsoft Entra'

          # The scheduled jobs install.sh switches on reach this path too -
          # bootstrap.sh is a wrapper around it, and a timer that only ever
          # gets enabled on the install.sh path is one half the installs do
          # not have.
          systemctl is-active dmarc-dns.timer dmarc-prune.timer dmarc-backup.timer dmarc-health.timer
          sudo sh -c 'ls -1 /opt/dmarc/backups/dmarc-*.bak'

          # Through Caddy, as a visitor would arrive: TLS terminated, proxied,
          # and the app - now with sign-in configured - sends them to Entra.
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)
          echo "https://localhost/: $code"; test "$code" = 302
          curl -sk -o /dev/null -D - https://localhost/ | grep -qi 'location: https://login.microsoftonline.com/common/'

          # The collector: its files, their permissions, and that it gets past
          # its own validation with the certificate that was made (a made-up
          # tenant, so authentication fails - exit 77 - and nothing else does).
          sudo test -f /opt/dmarc/data/ingest.pfx
          test "$(sudo stat -c '%a %U' /opt/dmarc/data/ingest.pfx)" = "600 dmarc"
          test -f "$HOME/dmarc-ingest.cer"
          test "$(sudo stat -c '%a %U' /etc/dmarc-ingest.env)" = "600 root"
          sudo grep -q '^DMARC_TENANT_ID="11111111' /etc/dmarc-ingest.env
          set +e
          sudo bash -c 'set -a; . /etc/dmarc-ingest.env; exec sudo -E -H -u dmarc dmarc ingest --db /opt/dmarc/data/dmarc.db --mailbox "$DMARC_MAILBOX" --dry-run' > ingest.out 2>&1
          code=$?
          set -e
          cat ingest.out; echo "exit $code"; test "$code" = 77
          grep -q 'Attributing reports by the shared address dmarc@example.com' ingest.out

          # Running it again only applies configuration. Captured to a file
          # rather than piped into grep -q, which would close the pipe on the
          # first match and kill the script half way with SIGPIPE.
          sudo ./deploy/bootstrap.sh --from-dir . --host localhost --email ci@example.com --provider-name "CI again" > second-run.out
          cat second-run.out
          grep -q 'already installed' second-run.out
          sudo grep -q '"ProviderName": "CI again"' /opt/dmarc/app/appsettings.Production.json
          systemctl is-active dmarc-web

      - name: What the services logged
        if: always()
        run: |
          sudo journalctl -u dmarc-web -n 30 --no-pager || true
          sudo journalctl -u caddy -n 30 --no-pager || true

  bootstrap-windows:
    name: One command on a fresh Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the release artifacts the way release.yml does
        shell: pwsh
        run: |
          dotnet publish src/DmarcMonitor.Cli/DmarcMonitor.Cli.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            --output publish/cli
          dotnet publish src/DmarcMonitor.Web/DmarcMonitor.Web.csproj `
            --configuration Release --output publish/dmarc-web
          Compress-Archive -Path publish/dmarc-web -DestinationPath dmarc-web.zip
          Copy-Item publish/cli/dmarc.exe dmarc.exe

      # The shape a workstation gets: collect on a schedule, leave nothing
      # running. Run first, into its own root, while no dmarc-web service
      # exists yet - so "no service was created" is a claim this can actually
      # make. A collector-only path nobody has run is how the trial download
      # shipped broken, and this is the same shape of gap.
      - name: Collector only, with nothing left running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\deploy\bootstrap.ps1 -FromDir . -Root C:\dmarc-collector -CollectorOnly -ProviderName CI

          if (Get-Service dmarc-web -ErrorAction SilentlyContinue) { throw 'a web service was installed anyway' }
          if (Get-Service caddy -ErrorAction SilentlyContinue) { throw 'a proxy was installed anyway' }
          if (-not (Test-Path C:\dmarc-collector\data\dmarc.db)) { throw 'no database' }

          # Registered unconditionally, because it needs no mailbox and no
          # certificate: without it the domains page shows dashes forever.
          if (-not (Get-ScheduledTask -TaskName 'DMARC DNS scan' -ErrorAction SilentlyContinue)) {
            throw 'no DMARC DNS scan task'
          }

          # And the dashboard still runs when a person starts it.
          $app = 'C:\dmarc-collector\app\DmarcMonitor.Web.dll'
          $dotnet = 'C:\dmarc-collector\dotnet\dotnet.exe'
          $proc = Start-Process -FilePath $dotnet `
            -ArgumentList @($app, '--contentRoot', 'C:\dmarc-collector\app') -PassThru
          try {
            $code = '000'
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              $code = & curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:5000/
              if ($code -match '^(2|3|4)') { break }
            }
            "on demand: $code"
            if ($code -notmatch '^(2|3|4)') { throw "the dashboard did not answer when started by hand ($code)" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            $proc.WaitForExit(15000) | Out-Null
          }

      - name: One command, from nothing
        shell: pwsh
        run: |
          # The runner image has IIS holding port 80 through http.sys, which
          # a fresh server would not. The script refuses to install Caddy over
          # a taken port and says so; here IIS is simply not wanted.
          Stop-Service -Name W3SVC -Force -ErrorAction SilentlyContinue
          Set-Service -Name W3SVC -StartupType Disabled -ErrorAction SilentlyContinue
          .\deploy\bootstrap.ps1 -FromDir . -HostName localhost -Email ci@example.com -ProviderName CI `
            -TenantId common -ClientId 00000000-0000-0000-0000-000000000000 `
            -MakeIngestCert -Mailbox dmarc@example.com `
            -IngestTenantId 11111111-2222-3333-4444-555555555555 `
            -IngestClientId 22222222-3333-4444-5555-666666666666

      - name: Everything it promised is true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Service dmarc-web).Status -ne 'Running') { throw 'dmarc-web is not running' }
          if ((Get-Service caddy).Status -ne 'Running') { throw 'caddy is not running' }
          $svc = Get-CimInstance Win32_Service -Filter "Name='dmarc-web'"
          "dmarc-web runs as $($svc.StartName)"
          if ($svc.StartName -notmatch 'LocalService') { throw "dmarc-web runs as $($svc.StartName), not LocalService" }

          $code = & curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:5000/
          "loopback: $code"; if ($code -ne '302') { throw "loopback answered $code" }
          $code = & curl.exe -sk -o NUL -w '%{http_code}' https://localhost/
          "https://localhost/: $code"; if ($code -ne '302') { throw "https answered $code" }
          $headers = & curl.exe -sk -D - -o NUL https://localhost/
          if (-not ($headers -match 'location: https://login.microsoftonline.com/common/')) { throw 'no redirect to Entra' }

          if (-not (Test-Path C:\dmarc\data\ingest.pfx)) { throw 'no ingest.pfx' }
          if (-not (Test-Path C:\dmarc\dmarc-ingest.cer)) { throw 'no dmarc-ingest.cer' }
          if (-not (Get-ScheduledTask -TaskName 'DMARC ingest' -ErrorAction SilentlyContinue)) { throw 'no DMARC ingest task' }

          # The secrets are readable by the service and administrators only:
          # nothing inherited from C:\, and LocalService (S-1-5-19) is named.
          foreach ($f in @('C:\dmarc\data\ingest.pfx', 'C:\dmarc\ingest.cmd', 'C:\dmarc\app\appsettings.Production.json')) {
            $acl = Get-Acl $f
            $sids = $acl.Access | ForEach-Object { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value }
            "$f -> $($sids -join ' ')"
            if ($acl.Access | Where-Object IsInherited) { throw "$f still inherits its ACL" }
            if ($sids -notcontains 'S-1-5-19') { throw "$f is not readable by LocalService" }
            if ($sids -contains 'S-1-5-32-545') { throw "$f is readable by every user" }
          }

          # The collector gets past its own validation with the certificate
          # that was made; a made-up tenant fails authentication (77).
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'C:\dmarc\ingest.cmd --dry-run' -Wait -PassThru -NoNewWindow
          Get-Content C:\dmarc\data\ingest.log
          "ingest exit $($p.ExitCode)"; if ($p.ExitCode -ne 77) { throw "ingest exited $($p.ExitCode)" }
          if (-not (Select-String -Path C:\dmarc\data\ingest.log -Pattern 'Attributing reports by the shared address dmarc@example.com' -Quiet)) { throw 'attribution line missing' }

          # Running it again only applies configuration.
          # The script talks through Write-Host (the information stream), which
          # an assignment does not capture; *>&1 folds every stream into one.
          $out = (.\deploy\bootstrap.ps1 -FromDir . -HostName localhost -Email ci@example.com -ProviderName 'CI again' *>&1) | Out-String
          $out
          if ($out -notmatch 'already installed') { throw 'second run did not detect the install' }
          if ((Get-Content C:\dmarc\app\appsettings.Production.json -Raw) -notmatch '"ProviderName":\s*"CI again"') { throw 'configuration was not applied' }
          if ((Get-Service dmarc-web).Status -ne 'Running') { throw 'dmarc-web is not running after the second run' }

      - name: What the services logged
        if: always()
        shell: pwsh
        run: |
          Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'dmarc|\.NET' } |
            Format-Table TimeCreated, ProviderName, Message -AutoSize -Wrap | Out-String -Width 200
          Get-Content C:\dmarc\bin\caddy-service.out.log -Tail 30 -ErrorAction SilentlyContinue
          Get-Content C:\dmarc\bin\caddy-service.err.log -Tail 30 -ErrorAction SilentlyContinue

  # The download somebody tries the product with, run the way they will run
  # it: a published executable, in an empty folder, with nothing installed.
  #
  # This is here rather than only in release.yml because of what it found.
  # Every other path starts the web app AFTER deploy/install.sh has run
  # `dmarc init-db`, so the application's own behaviour on a missing database
  # was never exercised - and it was to leave a zero-byte dmarc.db behind and
  # render "Could not read the database: no such table: tenants" on every
  # screen. Invisible on a server, and the entire experience of a trial copy.
  windows-trial:
    name: Windows trial download
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish it self-contained
        shell: pwsh
        run: |
          dotnet publish src/DmarcMonitor.Web/DmarcMonitor.Web.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --output "bundle/DMARC Monitor"
          dotnet publish src/DmarcMonitor.Cli/DmarcMonitor.Cli.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            --output publish/cli
          Copy-Item publish/cli/dmarc.exe "bundle/DMARC Monitor/dmarc.exe"
          Copy-Item "deploy/windows-trial/*" "bundle/DMARC Monitor/" -Force

      # The mistake that costs the most time, and the only branch of the
      # launcher that a working bundle never exercises: running the
      # application from inside the .zip. Windows copies out the one file that
      # was clicked and none of the several hundred beside it, so the
      # executable is simply not there.
      #
      # Tested by reproducing exactly that - the launcher alone in an empty
      # folder - because this branch only ever runs for somebody who is
      # already confused, and shipping a broken explanation to them is worse
      # than shipping none.
      - name: The launcher explains a bundle that was never extracted
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sandbox = Join-Path $PWD 'as-if-run-from-the-zip'
          New-Item -ItemType Directory -Path $sandbox -Force | Out-Null
          Copy-Item "deploy/windows-trial/Start DMARC Monitor.cmd" $sandbox
          $launcher = Join-Path $sandbox 'Start DMARC Monitor.cmd'

          # Piping an empty string gives `pause` its keystroke. Without it
          # this step would hang for six hours rather than fail.
          $out = '' | & cmd.exe /c "`"$launcher`"" 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out

          if ($code -ne 1) { throw "the not-extracted branch exited $code, expected 1" }
          if ($out -notmatch 'inside the \.zip') { throw 'it did not name the cause' }
          if ($out -notmatch 'Extract All')      { throw 'it did not say how to fix it' }

          'the launcher refused to run and explained why'

          # This step asserts that a program exited 1, so $LASTEXITCODE is 1
          # when the assertions finish - and a pwsh step inherits whatever a
          # native command left there, however well the PowerShell after it
          # went. Without this the step fails on its own success, which is
          # exactly what it did the first time it ran. A failed assertion
          # still fails the step: $ErrorActionPreference is Stop, so `throw`
          # never reaches this line.
          exit 0

      - name: The launcher and the note agree with the bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "bundle/DMARC Monitor"

          # What the note tells somebody to double-click has to exist, and the
          # launcher has to start the executable that is actually there. Both
          # were wrong in the shape that produced this job: a download whose
          # obvious-looking file was the command-line tool.
          $launcher = Get-Content (Join-Path $dir 'Start DMARC Monitor.cmd') -Raw
          if ($launcher -notmatch [regex]::Escape('"DmarcMonitor.Web.exe" %*')) {
            throw 'the launcher does not start DmarcMonitor.Web.exe'
          }
          if (-not (Test-Path (Join-Path $dir 'DmarcMonitor.Web.exe'))) {
            throw 'the launcher starts an executable that is not in the bundle'
          }

          $readme = Get-Content (Join-Path $dir 'README.txt') -Raw
          if ($readme -notmatch [regex]::Escape('Start DMARC Monitor.cmd')) {
            throw 'README.txt does not tell anybody what to double-click'
          }

          # dmarc.exe is the decoy: it sorts directly above the real
          # executable in Explorer and is the one that was opened. The note
          # has to say what it is.
          if ($readme -notmatch 'not the application') {
            throw 'README.txt does not warn that dmarc.exe is not the dashboard'
          }

      - name: Double-click it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Started from its own folder, because that is what double-clicking
          # in Explorer does - and it is where the database and the keys are
          # meant to land, since the README promises that deleting the folder
          # removes every trace.
          $exe  = (Resolve-Path "bundle/DMARC Monitor/DmarcMonitor.Web.exe").Path
          $work = (Resolve-Path "bundle/DMARC Monitor").Path
          $out  = Join-Path $PWD 'trial.out'
          $err  = Join-Path $PWD 'trial.err'

          # Every dotnet directory stripped from PATH and DOTNET_ROOT cleared,
          # so nothing this runner happens to have installed can stand in for
          # what somebody downloading the zip does not. The child process
          # inherits these.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch 'dotnet' }) -join ';'
          $env:DOTNET_ROOT = ''
          $env:ASPNETCORE_URLS = 'http://127.0.0.1:5000'
          $env:DMARC_NO_BROWSER = '1'      # there is no desktop on a runner

          $p = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru -NoNewWindow `
                 -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            # No -MaximumRedirection 0 here. /local-signin answers 302, and
            # PowerShell raises "the maximum redirection count has been
            # exceeded" for a redirect it is told not to follow - which
            # -SkipHttpErrorCheck does NOT suppress, because it is not an HTTP
            # error status. The catch below would have swallowed that on every
            # attempt and the loop would have timed out against a server that
            # was answering perfectly.
            $session = $null
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 2
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:5000/local-signin' `
                  -SessionVariable session -SkipHttpErrorCheck -ErrorAction Stop | Out-Null
                break
              } catch { $session = $null }
            }
            Get-Content $out -ErrorAction SilentlyContinue
            Get-Content $err -ErrorAction SilentlyContinue
            if (-not $session) { throw 'the published executable never answered on 127.0.0.1:5000' }

            # It made its own database, in the folder it was run from.
            $db = Join-Path $work 'dmarc.db'
            if (-not (Test-Path $db))             { throw 'no database was created' }
            if ((Get-Item $db).Length -le 0)      { throw 'the database it created is empty' }
            if (-not (Test-Path (Join-Path $work 'keys'))) { throw 'no key directory beside the database' }

            # Static files resolve. The content root is the executable's own
            # directory rather than whatever the working directory happens to
            # be, and when that was wrong the application served every page
            # unstyled with one warning in a log nobody was reading.
            $css = Invoke-WebRequest -Uri 'http://127.0.0.1:5000/app.css' -WebSession $session -SkipHttpErrorCheck
            "app.css: $($css.StatusCode)"
            if ($css.StatusCode -ne 200) { throw "the stylesheet answered $($css.StatusCode); the pages would render unstyled" }

            # And the dashboard reads it. "No domains yet" is the empty state;
            # "Could not read the database" is the bug this job exists for, and
            # asserting the absence of it alone would pass on a blank page.
            $page = (Invoke-WebRequest -Uri 'http://127.0.0.1:5000/' -WebSession $session -SkipHttpErrorCheck).Content
            if ($page -match 'Could not read the database') { throw 'the dashboard cannot read the database it just created' }
            if ($page -notmatch 'Triage')        { throw 'the dashboard did not render' }
            if ($page -notmatch 'No domains yet') { throw 'the empty state did not render' }
            if ($page -notmatch 'Local trial mode') { throw 'the trial-mode banner is missing' }

            # Every other page, on the published executable, on Windows.
            #
            # The checks above are all about the dashboard, and a trial copy
            # is judged by clicking around it. A page that throws still
            # answers 200 with an error boundary in the body, so the status
            # code proves nothing on its own - which is why the body is what
            # is read here.
            #
            # Cheap, and it covers the routes nothing else on Windows touches:
            # the two report pages, the sources list, and the fix view.
            foreach ($route in '/domains', '/sources', '/fix', '/reports', '/tls', '/failures', '/clients', '/settings') {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:5000$route" -WebSession $session -SkipHttpErrorCheck
              "$route : $($r.StatusCode)"
              if ($r.StatusCode -ne 200) { throw "$route answered $($r.StatusCode)" }
              if ($r.Content -match 'An unhandled error has occurred') { throw "$route rendered an error boundary" }
              if ($r.Content -match 'Could not read the database')     { throw "$route could not read the database" }
            }

            # Local trial mode still refuses anything arriving through a proxy.
            # A copy on somebody's desktop must not become a way in if they
            # ever port-forward to it.
            $proxied = Invoke-WebRequest -Uri 'http://127.0.0.1:5000/' -WebSession $session `
                         -Headers @{ 'X-Forwarded-For' = '203.0.113.9' } -SkipHttpErrorCheck
            "proxied: $($proxied.StatusCode)"
            if ($proxied.StatusCode -ne 403) { throw "a proxied request got $($proxied.StatusCode), not 403" }

            'the published exe created a database and served the dashboard with no runtime installed'
          }
          finally {
            # Stop-Process returns before the process has gone, and Windows
            # keeps the database file locked until it has. The next step reads
            # that file, so wait rather than race it.
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force; $p.WaitForExit(30000) | Out-Null }
          }

      - name: A second run adopts the database rather than remaking it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe  = (Resolve-Path "bundle/DMARC Monitor/DmarcMonitor.Web.exe").Path
          $work = (Resolve-Path "bundle/DMARC Monitor").Path

          $env:ASPNETCORE_URLS = 'http://127.0.0.1:5000'
          $env:DMARC_NO_BROWSER = '1'
          $p = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru -NoNewWindow `
                 -RedirectStandardOutput (Join-Path $PWD 'second.out') `
                 -RedirectStandardError  (Join-Path $PWD 'second.err')
          try {
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 2
              try { Invoke-WebRequest -Uri 'http://127.0.0.1:5000/' -SkipHttpErrorCheck -ErrorAction Stop | Out-Null; break } catch { }
            }
            $log = (Get-Content (Join-Path $PWD 'second.out') -Raw -ErrorAction SilentlyContinue)
            $log
            if ($log -match 'Created a new database') { throw 'it created a second database over the first' }
          }
          finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force; $p.WaitForExit(30000) | Out-Null }
          }

          # Not a byte comparison of the file. SQLite in WAL mode legitimately
          # rewrites the main database when it checkpoints, so identical bytes
          # is neither necessary nor sufficient - it would fail on a correct
          # run and pass on a database that had been emptied and recreated at
          # the same size. What matters is that it is still OUR database at
          # the schema this build expects, which the shipped tool answers
          # exactly, and which also proves dmarc.exe works from the bundle.
          $check = & "bundle/DMARC Monitor/dmarc.exe" init-db --db (Join-Path $work 'dmarc.db') 2>&1 | Out-String
          $check
          if ($LASTEXITCODE -ne 0) { throw "dmarc.exe init-db exited $LASTEXITCODE against the database the app made" }
          if ($check -notmatch 'already exists and is up to date') {
            throw 'the database is not a current DMARC Monitor database after a second run'
          }
          'second run adopted the database it found'

      # The bundle this job just built and proved, kept where somebody can
      # download it.
      #
      # It was built on every commit and thrown away every time, so the only
      # way to get a copy that runs was to merge and tag a release. That is a
      # long way round when the question is "can I show this to someone on
      # Thursday", and it means the artifact people actually try is never the
      # one CI verified - it is a later build nobody watched.
      #
      # Every job above has already run against it: the launcher, the first
      # run against no database, and dmarc.exe from inside the bundle. What is
      # uploaded here is that exact folder.
      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: dmarc-windows-trial
          path: 'bundle/DMARC Monitor'

          # Long enough to cover a demo and a week of second thoughts, short
          # enough that unsigned builds do not accumulate indefinitely.
          retention-days: 14
          if-no-files-found: error

  schema:
    name: SQLite schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply schema to an empty database
        run: |
          # db/schema.sql is the contract the future EF Core migration is
          # generated from. If it stops applying cleanly, everything built on
          # it is built on sand.
          sqlite3 /tmp/schema-check.db < db/schema.sql
          echo "--- tables ---"
          sqlite3 /tmp/schema-check.db \
            "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;"
          echo "--- views ---"
          sqlite3 /tmp/schema-check.db "SELECT name FROM sqlite_master WHERE type='view' ORDER BY name;"

      - name: Run schema constraint checks
        run: |
          # Proves the constraints actually fire: report dedup, one-domain-one-
          # client, FK integrity, CHECK enums, tenant isolation, cascade delete.
          # The negative cases are expected to error, so this deliberately does
          # not use "set -e" semantics for the whole file.
          sqlite3 /tmp/schema-check.db < db/schema-verify.sql > /tmp/verify.out 2>&1 || true
          cat /tmp/verify.out

          fail=0
          check() {
            if grep -qF "$1" /tmp/verify.out; then
              echo "ok   $2"
            else
              echo "FAIL $2 (expected to find: $1)"
              fail=1
            fi
          }
          check "UNIQUE constraint failed: aggregate_reports.org_name" "duplicate report rejected"
          check "UNIQUE constraint failed: domains.tenant_id, domains.name" "same-tenant domain conflict rejected"
          check "FOREIGN KEY constraint failed"                        "orphan record rejected"
          check "CHECK constraint failed"                              "invalid enum rejected"
          check "orphan_domains=0"                                     "cascade delete removed client's domains"
          check "acme_survives=2"                                      "other client's data untouched"
          # Tenant layer. These are the security boundary in a hosted
          # deployment, not a convenience: if a tenant-scoped read ever
          # returns another tenant's rows, one MSP is reading a competitor's
          # book of business.
          check "nls_sees_rival_rows=0"                                "TENANT ISOLATION: no cross-tenant rows"
          check "rival_row_count=1"                                    "the other tenant has its own data"
          check "acme_com_managed_by=2_tenants"                        "two tenants may manage the same domain name"
          check "acme_corp_slug_used_by=2_tenants"                     "two tenants may reuse a client slug"
          check "UNIQUE constraint failed: clients.tenant_id, clients.slug" "one tenant cannot reuse a client slug"
          check "rival_clients=0"                                      "tenant cascade removed its clients"
          check "rival_domains=0"                                      "tenant cascade removed its domains"
          check "rival_records=0"                                      "tenant cascade removed its aggregate records"
          check "nls_survives=2"                                       "deleting one tenant leaves the other intact"
          check "USING INDEX ix_agg_rec_tenant_date"                   "isolation filter uses a tenant-leading index"
          # Remediation tables: a refused plan is still recorded, an applied
          # change keeps its rollback target, secrets stay out of the database,
          # and a client's remediation history dies with the client.
          check "refused_plan_stored=1"                                "refused plan is still recorded"
          check "change_rollback_target=v=spf1 include:a -all"         "applied change keeps its rollback target"
          check "stores_only_ref=DnsToken_c-acme_cloudflare"           "provider config stores a credential ref, not a secret"
          check "UNIQUE constraint failed: spf_flatten_state.domain_id" "one flatten state per domain enforced"
          check "orphan_plans=0"                                       "cascade removed change plans"
          check "orphan_changes=0"                                     "cascade removed applied changes"
          check "orphan_provider=0"                                    "cascade removed provider configs"
          check "orphan_flatten=0"                                     "cascade removed flatten state"
          exit $fail
