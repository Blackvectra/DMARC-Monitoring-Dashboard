name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu proves the parsers are pure and portable, which is what makes
        # the eventual C# port straightforward. windows is the platform the
        # engine actually ships on, so it is the one that must stay green.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
          key: psmodules-${{ runner.os }}-pester6

      - name: Install Pester
        shell: pwsh
        run: |
          $existing = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version -ge [version]'6.0.0' } |
            Sort-Object Version -Descending | Select-Object -First 1
          if ($existing) {
            "Pester $($existing.Version) already present"
          } else {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 6.0.0
          }

      - name: Syntax check every script
        shell: pwsh
        run: |
          # The PowerShell parser is the first thing that runs on the target
          # machine too. A parse error here means the dashboard never opens -
          # exactly the failure mode of PR #7.
          $bad = 0
          Get-ChildItem -Path ./tools, ./legacy, ./deploy -Filter *.ps1 -File | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count -gt 0) {
              $bad++
              Write-Host "::error file=$($_.Name)::$($errs.Count) parse error(s)"
              $errs | ForEach-Object {
                Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Run Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path        = './tests'
          $cfg.Run.Exit        = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled      = $true
          $cfg.TestResult.OutputPath   = 'testresults.xml'
          $cfg.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $cfg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}
          path: testresults.xml
          if-no-files-found: warn

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DmarcMonitor.sln

      # Warnings are errors in Directory.Build.props. The point of moving off
      # PowerShell is that a whole class of bug fails the build rather than
      # surviving to be found by a test somebody remembered to write.
      - name: Build
        run: dotnet build src/DmarcMonitor.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/DmarcMonitor.sln --no-build --configuration Release --verbosity normal

  install:
    name: Install on a fresh Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Lint the deploy scripts and units
        run: |
          shellcheck -S warning deploy/*.sh
          for f in deploy/*.sh; do bash -n "$f"; done

          # The distro packages put the runtime at /usr/bin/dotnet, which is
          # what the units name; setup-dotnet puts it somewhere else. Same
          # layout as the packages, so the units are verified as shipped.
          sudo ln -sf "$(command -v dotnet)" /usr/bin/dotnet

          # verify insists the executables exist. The agent's is installed by
          # install-update-agent.sh, which runs later; a stub stands in.
          sudo install -D -m 0755 /bin/true /opt/dmarc/deploy/update-agent.sh
          sudo install -D -m 0755 /bin/true /usr/local/bin/dmarc
          systemd-analyze verify --man=no deploy/*.service deploy/*.timer deploy/*.path
          sudo rm -rf /opt/dmarc /usr/local/bin/dmarc

      - name: Build the two release artifacts
        run: |
          # The same two files release.yml attaches, built the same way.
          dotnet publish src/DmarcMonitor.Cli/DmarcMonitor.Cli.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            --output publish/cli
          dotnet publish src/DmarcMonitor.Web/DmarcMonitor.Web.csproj \
            --configuration Release --output publish/dmarc-web
          (cd publish && zip -qr ../dmarc-web.zip dmarc-web)
          cp publish/cli/dmarc dmarc-linux-x64

      - name: Install from nothing
        run: sudo ./deploy/install.sh --web dmarc-web.zip --cli dmarc-linux-x64

      - name: The service is up, sandboxed, and answers the way the docs say
        run: |
          systemctl is-active dmarc-web
          systemctl show dmarc-web -p User -p ProtectSystem -p ProtectHome -p ReadWritePaths

          # Local trial mode: a loopback request is served (redirected to the
          # local sign-in), a proxied one is refused. Both from the same port.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/)
          echo "loopback: $code"; [[ "$code" =~ ^(200|302)$ ]]
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 203.0.113.9' http://127.0.0.1:5000/)
          echo "proxied:  $code"; test "$code" = 403

          # Signing in mints a cookie key. It must land beside the database,
          # because the unit hides the home directory: a key that went there
          # would exist only in memory, and every restart would sign everybody
          # out.
          curl -s -o /dev/null http://127.0.0.1:5000/local-signin
          sudo ls /opt/dmarc/data/keys/ | grep -q '^key-.*\.xml$'
          sudo test ! -e /opt/dmarc/.aspnet

          # The service account can run the command the timer will run.
          sudo -u dmarc dmarc version
          sudo -u dmarc ls /opt/dmarc/data/.net >/dev/null

          # It never overwrites configuration, and it never runs twice.
          test "$(sudo stat -c '%a %U' /opt/dmarc/app/appsettings.Production.json)" = "600 dmarc"
          test "$(sudo stat -c '%a %U' /etc/dmarc-ingest.env)" = "600 root"
          if sudo ./deploy/install.sh --web dmarc-web.zip --cli dmarc-linux-x64; then
            echo "install.sh ran over an existing install"; exit 1
          fi

      - name: The update agent's path unit wakes and refuses a bogus request
        run: |
          # OPEN-ISSUES.md said no systemd path unit had ever woken. This is
          # the wake: a request the agent must refuse, written the way the app
          # writes one, and the status the agent leaves behind.
          sudo ./deploy/install-update-agent.sh
          systemctl is-active dmarc-update.path

          echo '{"Version":"../../etc/passwd","RequestedBy":"ci"}' \
            | sudo -u dmarc tee /opt/dmarc/data/updates/requested.json >/dev/null
          for _ in $(seq 1 30); do
            sudo test -f /opt/dmarc/data/updates/status.json && break
            sleep 1
          done
          sudo cat /opt/dmarc/data/updates/status.json
          sudo grep -q '"State": "Failed"' /opt/dmarc/data/updates/status.json
          sudo grep -q 'not a version number' /opt/dmarc/data/updates/status.json
          sudo test ! -e /opt/dmarc/data/updates/requested.json
          sudo journalctl -u dmarc-update -n 20 --no-pager

      - name: Rolling back to a stamp that was never kept is refused
        run: |
          set +e
          sudo ./deploy/rollback.sh 19700101-000000
          code=$?
          set -e
          echo "exit $code"; test "$code" = 66
          systemctl is-active dmarc-web

      - name: What the service logged
        if: always()
        run: sudo journalctl -u dmarc-web -n 40 --no-pager || true

  bootstrap-linux:
    name: One command on a fresh Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the release artifacts the way release.yml does
        run: |
          dotnet publish src/DmarcMonitor.Cli/DmarcMonitor.Cli.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            --output publish/cli
          dotnet publish src/DmarcMonitor.Web/DmarcMonitor.Web.csproj \
            --configuration Release --output publish/dmarc-web
          (cd publish && zip -qr ../dmarc-web.zip dmarc-web)
          cp publish/cli/dmarc dmarc-linux-x64
          # The distro package puts the runtime at /usr/bin/dotnet, which is
          # what the unit names and what bootstrap finds under sudo's PATH.
          # setup-dotnet puts it elsewhere; this stands in for the package.
          sudo ln -sf "$(command -v dotnet)" /usr/bin/dotnet

      - name: One command, from nothing
        run: |
          # Everything at once: Caddy on localhost (its internal CA, so no
          # public DNS is needed), Entra sign-in against the "common" tenant
          # (real metadata, so the redirect is built for real), and the
          # collector with a certificate the script makes.
          sudo ./deploy/bootstrap.sh --from-dir . --host localhost --email ci@example.com \
            --provider-name CI --tenant-id common --client-id 00000000-0000-0000-0000-000000000000 \
            --make-ingest-cert --mailbox dmarc@example.com \
            --ingest-tenant-id 11111111-2222-3333-4444-555555555555 \
            --ingest-client-id 22222222-3333-4444-5555-666666666666

      - name: Everything it promised is true
        run: |
          systemctl is-active dmarc-web caddy dmarc-ingest.timer dmarc-update.path
          sudo journalctl -u dmarc-web -n 30 --no-pager | grep -q 'Sign-in: Microsoft Entra'

          # Through Caddy, as a visitor would arrive: TLS terminated, proxied,
          # and the app - now with sign-in configured - sends them to Entra.
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)
          echo "https://localhost/: $code"; test "$code" = 302
          curl -sk -o /dev/null -D - https://localhost/ | grep -qi 'location: https://login.microsoftonline.com/common/'

          # The collector: its files, their permissions, and that it gets past
          # its own validation with the certificate that was made (a made-up
          # tenant, so authentication fails - exit 77 - and nothing else does).
          sudo test -f /opt/dmarc/data/ingest.pfx
          test "$(sudo stat -c '%a %U' /opt/dmarc/data/ingest.pfx)" = "600 dmarc"
          test -f "$HOME/dmarc-ingest.cer"
          test "$(sudo stat -c '%a %U' /etc/dmarc-ingest.env)" = "600 root"
          sudo grep -q '^DMARC_TENANT_ID="11111111' /etc/dmarc-ingest.env
          set +e
          sudo bash -c 'set -a; . /etc/dmarc-ingest.env; exec sudo -E -H -u dmarc dmarc ingest --db /opt/dmarc/data/dmarc.db --mailbox "$DMARC_MAILBOX" --dry-run' > ingest.out 2>&1
          code=$?
          set -e
          cat ingest.out; echo "exit $code"; test "$code" = 77
          grep -q 'Attributing reports by the shared address dmarc@example.com' ingest.out

          # Running it again only applies configuration. Captured to a file
          # rather than piped into grep -q, which would close the pipe on the
          # first match and kill the script half way with SIGPIPE.
          sudo ./deploy/bootstrap.sh --from-dir . --host localhost --email ci@example.com --provider-name "CI again" > second-run.out
          cat second-run.out
          grep -q 'already installed' second-run.out
          sudo grep -q '"ProviderName": "CI again"' /opt/dmarc/app/appsettings.Production.json
          systemctl is-active dmarc-web

      - name: What the services logged
        if: always()
        run: |
          sudo journalctl -u dmarc-web -n 30 --no-pager || true
          sudo journalctl -u caddy -n 30 --no-pager || true

  bootstrap-windows:
    name: One command on a fresh Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the release artifacts the way release.yml does
        shell: pwsh
        run: |
          dotnet publish src/DmarcMonitor.Cli/DmarcMonitor.Cli.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            --output publish/cli
          dotnet publish src/DmarcMonitor.Web/DmarcMonitor.Web.csproj `
            --configuration Release --output publish/dmarc-web
          Compress-Archive -Path publish/dmarc-web -DestinationPath dmarc-web.zip
          Copy-Item publish/cli/dmarc.exe dmarc.exe

      - name: One command, from nothing
        shell: pwsh
        run: |
          # The runner image has IIS holding port 80 through http.sys, which
          # a fresh server would not. The script refuses to install Caddy over
          # a taken port and says so; here IIS is simply not wanted.
          Stop-Service -Name W3SVC -Force -ErrorAction SilentlyContinue
          Set-Service -Name W3SVC -StartupType Disabled -ErrorAction SilentlyContinue
          .\deploy\bootstrap.ps1 -FromDir . -HostName localhost -Email ci@example.com -ProviderName CI `
            -TenantId common -ClientId 00000000-0000-0000-0000-000000000000 `
            -MakeIngestCert -Mailbox dmarc@example.com `
            -IngestTenantId 11111111-2222-3333-4444-555555555555 `
            -IngestClientId 22222222-3333-4444-5555-666666666666

      - name: Everything it promised is true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Service dmarc-web).Status -ne 'Running') { throw 'dmarc-web is not running' }
          if ((Get-Service caddy).Status -ne 'Running') { throw 'caddy is not running' }
          $svc = Get-CimInstance Win32_Service -Filter "Name='dmarc-web'"
          "dmarc-web runs as $($svc.StartName)"
          if ($svc.StartName -notmatch 'LocalService') { throw "dmarc-web runs as $($svc.StartName), not LocalService" }

          $code = & curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:5000/
          "loopback: $code"; if ($code -ne '302') { throw "loopback answered $code" }
          $code = & curl.exe -sk -o NUL -w '%{http_code}' https://localhost/
          "https://localhost/: $code"; if ($code -ne '302') { throw "https answered $code" }
          $headers = & curl.exe -sk -D - -o NUL https://localhost/
          if (-not ($headers -match 'location: https://login.microsoftonline.com/common/')) { throw 'no redirect to Entra' }

          if (-not (Test-Path C:\dmarc\data\ingest.pfx)) { throw 'no ingest.pfx' }
          if (-not (Test-Path C:\dmarc\dmarc-ingest.cer)) { throw 'no dmarc-ingest.cer' }
          if (-not (Get-ScheduledTask -TaskName 'DMARC ingest' -ErrorAction SilentlyContinue)) { throw 'no DMARC ingest task' }

          # The collector gets past its own validation with the certificate
          # that was made; a made-up tenant fails authentication (77).
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'C:\dmarc\ingest.cmd --dry-run' -Wait -PassThru -NoNewWindow
          Get-Content C:\dmarc\data\ingest.log
          "ingest exit $($p.ExitCode)"; if ($p.ExitCode -ne 77) { throw "ingest exited $($p.ExitCode)" }
          if (-not (Select-String -Path C:\dmarc\data\ingest.log -Pattern 'Attributing reports by the shared address dmarc@example.com' -Quiet)) { throw 'attribution line missing' }

          # Running it again only applies configuration.
          # The script talks through Write-Host (the information stream), which
          # an assignment does not capture; *>&1 folds every stream into one.
          $out = (.\deploy\bootstrap.ps1 -FromDir . -HostName localhost -Email ci@example.com -ProviderName 'CI again' *>&1) | Out-String
          $out
          if ($out -notmatch 'already installed') { throw 'second run did not detect the install' }
          if ((Get-Content C:\dmarc\app\appsettings.Production.json -Raw) -notmatch '"ProviderName":\s*"CI again"') { throw 'configuration was not applied' }
          if ((Get-Service dmarc-web).Status -ne 'Running') { throw 'dmarc-web is not running after the second run' }

      - name: What the services logged
        if: always()
        shell: pwsh
        run: |
          Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'dmarc|\.NET' } |
            Format-Table TimeCreated, ProviderName, Message -AutoSize -Wrap | Out-String -Width 200
          Get-Content C:\dmarc\bin\caddy-service.out.log -Tail 30 -ErrorAction SilentlyContinue
          Get-Content C:\dmarc\bin\caddy-service.err.log -Tail 30 -ErrorAction SilentlyContinue

  schema:
    name: SQLite schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply schema to an empty database
        run: |
          # db/schema.sql is the contract the future EF Core migration is
          # generated from. If it stops applying cleanly, everything built on
          # it is built on sand.
          sqlite3 /tmp/schema-check.db < db/schema.sql
          echo "--- tables ---"
          sqlite3 /tmp/schema-check.db \
            "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;"
          echo "--- views ---"
          sqlite3 /tmp/schema-check.db "SELECT name FROM sqlite_master WHERE type='view' ORDER BY name;"

      - name: Run schema constraint checks
        run: |
          # Proves the constraints actually fire: report dedup, one-domain-one-
          # client, FK integrity, CHECK enums, tenant isolation, cascade delete.
          # The negative cases are expected to error, so this deliberately does
          # not use "set -e" semantics for the whole file.
          sqlite3 /tmp/schema-check.db < db/schema-verify.sql > /tmp/verify.out 2>&1 || true
          cat /tmp/verify.out

          fail=0
          check() {
            if grep -qF "$1" /tmp/verify.out; then
              echo "ok   $2"
            else
              echo "FAIL $2 (expected to find: $1)"
              fail=1
            fi
          }
          check "UNIQUE constraint failed: aggregate_reports.org_name" "duplicate report rejected"
          check "UNIQUE constraint failed: domains.tenant_id, domains.name" "same-tenant domain conflict rejected"
          check "FOREIGN KEY constraint failed"                        "orphan record rejected"
          check "CHECK constraint failed"                              "invalid enum rejected"
          check "orphan_domains=0"                                     "cascade delete removed client's domains"
          check "acme_survives=2"                                      "other client's data untouched"
          # Tenant layer. These are the security boundary in a hosted
          # deployment, not a convenience: if a tenant-scoped read ever
          # returns another tenant's rows, one MSP is reading a competitor's
          # book of business.
          check "nls_sees_rival_rows=0"                                "TENANT ISOLATION: no cross-tenant rows"
          check "rival_row_count=1"                                    "the other tenant has its own data"
          check "acme_com_managed_by=2_tenants"                        "two tenants may manage the same domain name"
          check "acme_corp_slug_used_by=2_tenants"                     "two tenants may reuse a client slug"
          check "UNIQUE constraint failed: clients.tenant_id, clients.slug" "one tenant cannot reuse a client slug"
          check "rival_clients=0"                                      "tenant cascade removed its clients"
          check "rival_domains=0"                                      "tenant cascade removed its domains"
          check "rival_records=0"                                      "tenant cascade removed its aggregate records"
          check "nls_survives=2"                                       "deleting one tenant leaves the other intact"
          check "USING INDEX ix_agg_rec_tenant_date"                   "isolation filter uses a tenant-leading index"
          # Remediation tables: a refused plan is still recorded, an applied
          # change keeps its rollback target, secrets stay out of the database,
          # and a client's remediation history dies with the client.
          check "refused_plan_stored=1"                                "refused plan is still recorded"
          check "change_rollback_target=v=spf1 include:a -all"         "applied change keeps its rollback target"
          check "stores_only_ref=DnsToken_c-acme_cloudflare"           "provider config stores a credential ref, not a secret"
          check "UNIQUE constraint failed: spf_flatten_state.domain_id" "one flatten state per domain enforced"
          check "orphan_plans=0"                                       "cascade removed change plans"
          check "orphan_changes=0"                                     "cascade removed applied changes"
          check "orphan_provider=0"                                    "cascade removed provider configs"
          check "orphan_flatten=0"                                     "cascade removed flatten state"
          exit $fail
