name: Release

# Nothing downloadable existed: the CLI needed a git checkout and an SDK to
# run at all, which makes the first question anybody asks - "can I try it?" -
# a half-hour answer. This produces the two things somebody actually installs.
on:
  push:
    # Both cases. These filters are case-SENSITIVE, and a tag of V1.0.0
    # matched nothing at all: the release was created, said "Latest", and
    # carried no files, so every install command pointed at a 404. A tag
    # that silently produces an empty release is the worst shape this can
    # fail in, because the page looks right.
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write        # needed only to attach files to a release

jobs:
  cli:
    name: dmarc.exe (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is where an MSP runs this. Linux because the eventual
          # hosted deployment is a container, and finding out it does not
          # publish there at release time is finding out too late.
          - { os: windows-latest,   rid: win-x64,     exe: dmarc.exe, machine: ''            }
          - { os: ubuntu-latest,    rid: linux-x64,   exe: dmarc,     machine: 'x86-64'      }
          # ARM, because the cheapest instance at both AWS and Azure is one
          # (t4g, Dpsv5). Built AND RUN on an arm64 runner: this was
          # cross-compiled from x64 and shipped having never been executed,
          # with its ELF header and its file size standing in for knowing it
          # starts. GitHub's arm64 runners are free for public repositories,
          # so that trade no longer buys anything.
          - { os: ubuntu-24.04-arm, rid: linux-arm64, exe: dmarc,     machine: 'ARM aarch64' }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: version
        shell: bash
        run: |
          # The tag is the version. A manual run has no tag, so it gets one
          # that is obviously not a release rather than a plausible number.
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* || "$ref" == V* ]]; then
            number="${ref#[vV]}"

            # Refuse a tag that is not a version rather than stamping the
            # build with whatever was typed. dotnet takes -p:Version= on
            # trust, so "v1.0" or "vFinal" would either fail deep in the
            # build or produce a binary that misreports itself.
            if [[ ! "$number" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$ref' is not a version. Expected v1.2.3, so the build can be stamped with 1.2.3." >&2
              exit 64
            fi

            echo "number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "number=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: |
          # IncludeNativeLibrariesForSelfExtract puts e_sqlite3 inside the
          # binary rather than beside it. Without it the exe is not actually
          # one file, and somebody copies it alone and gets a runtime error
          # about a missing native library.
          dotnet publish src/DmarcMonitor.Cli/DmarcMonitor.Cli.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:Version=${{ steps.version.outputs.number }} \
            --output publish/${{ matrix.rid }}

      # No longer conditional. Every published binary is now built on the
      # machine it targets, so every one of them can be started here, and the
      # only build that was exempt was the one the AWS runbook recommended.
      - name: Prove the single file actually runs on its own
        shell: bash
        run: |
          # The whole point of this job. Copy the binary somewhere with
          # nothing else in it - no schema file, no native library, no
          # checkout - and make it create a database. That is the first thing
          # anybody does with it, and the thing that breaks when the schema is
          # not embedded or SQLite did not get bundled.
          mkdir -p smoke
          cp publish/${{ matrix.rid }}/${{ matrix.exe }} smoke/
          cd smoke

          ls -la
          ./${{ matrix.exe }} init-db --db proof.db
          test -f proof.db || { echo "init-db reported success but wrote no database"; exit 1; }

          # And that it can read a report without a database or configuration.
          ./${{ matrix.exe }} explain ../src/DmarcMonitor.Core.Tests/Fixtures/google-aggregate.xml

      - name: Check the binary is for the architecture it claims
        if: matrix.machine
        shell: bash
        run: |
          # Running it proves it works on this runner. This proves the runner
          # is the machine the artifact is named after - which is the failure
          # a matrix has when a runner label changes under it, and the one
          # that would be invisible: an x64 binary published as
          # dmarc-linux-arm64 passes every test above and dies on the
          # instance.
          #
          # And that it is big enough to be self-contained rather than a stub
          # expecting a runtime beside it.
          binary=publish/${{ matrix.rid }}/${{ matrix.exe }}
          test -f "$binary" || { echo "nothing was published"; exit 1; }

          # `file` is present on both Linux images today - this step has run
          # green on ubuntu-24.04-arm - but tests.yml installs it explicitly
          # on that same runner, on the grounds that the arm64 image is a
          # smaller build and a tool that happens to be on one image is not a
          # thing to rely on being on the other. Both cannot be right, and a
          # missing tool here fails a RELEASE rather than a pull request.
          command -v file >/dev/null || sudo apt-get install -y -qq file

          file "$binary"
          file "$binary" | grep -q '${{ matrix.machine }}' \
            || { echo "published binary is not a ${{ matrix.machine }} executable"; exit 1; }

          size=$(stat -c%s "$binary")
          test "$size" -gt 20000000 \
            || { echo "only $size bytes: too small to be self-contained"; exit 1; }

      # The same Authenticode signing as the trial bundle, for the one asset
      # somebody downloads on its own. Inert without the secrets, and skipped
      # outright on the Linux rows - Authenticode is a Windows format and
      # there is no equivalent to apply to an ELF binary here.
      - name: Is signing configured?
        id: signing
        if: matrix.rid == 'win-x64'
        shell: bash
        env:
          ENDPOINT: ${{ secrets.SIGNING_ENDPOINT }}
        run: |
          if [ -n "$ENDPOINT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned build::dmarc.exe is not signed; see docs/SIGNING.md."
          fi

      - name: Sign
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\publish\win-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signature is one Windows will accept
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature "publish/win-x64/dmarc.exe"
          "dmarc.exe: {0} ({1})" -f $sig.Status, $sig.SignerCertificate.Subject
          if ($sig.Status -ne 'Valid') { throw "dmarc.exe signature is $($sig.Status)" }
          if (-not $sig.TimeStamperCertificate) { throw 'dmarc.exe was signed without a timestamp' }

      - uses: actions/upload-artifact@v4
        with:
          name: dmarc-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/${{ matrix.exe }}
          if-no-files-found: error

  # One download, nothing to install, no server. The web bundle below is the
  # one a deployment uses and it needs the ASP.NET Core 8 runtime on the host;
  # that is the right trade for a server and the wrong one for somebody who
  # just wants to see whether this is worth deploying. Self-contained costs
  # about 100 MB of release asset and removes every prerequisite: no runtime,
  # no administrator, no service, no reverse proxy, no Entra.
  #
  # It is the same application, in local trial mode - the mode that serves
  # loopback only and refuses anything arriving through a proxy - so what
  # somebody tries is the product rather than a demo of it.
  trial:
    name: Windows trial bundle
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: version
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* || "$ref" == V* ]]; then
            number="${ref#[vV]}"
            if [[ ! "$number" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$ref' is not a version. Expected v1.2.3, so the build can be stamped with 1.2.3." >&2
              exit 64
            fi
            echo "number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "number=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish, self-contained
        shell: pwsh
        run: |
          # Not PublishSingleFile. A Blazor Server app carries static web
          # assets that do not go inside the bundle, so a "single file" here
          # would be one exe that still needs the folder around it - which
          # looks like one file and is not. A folder with one obvious
          # executable in it is honest and works.
          dotnet publish src/DmarcMonitor.Web/DmarcMonitor.Web.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.number }} `
            --output "bundle/DMARC Monitor"

          # The command-line tool travels with it: importing a folder of
          # reports is `dmarc import`, and the Import page in the app covers
          # drag-and-drop but not a directory of thousands.
          dotnet publish src/DmarcMonitor.Cli/DmarcMonitor.Cli.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=${{ steps.version.outputs.number }} `
            --output publish/cli
          Copy-Item publish/cli/dmarc.exe "bundle/DMARC Monitor/dmarc.exe"

      - name: Add the launcher and the note
        shell: pwsh
        run: |
          # Both of these are files in the repository rather than a heredoc in
          # this workflow, because the last version of them was neither
          # reviewable in a diff nor checkable by the job below - and what the
          # note tells somebody to double-click turned out to matter a great
          # deal. See deploy/windows-trial/.
          Copy-Item "deploy/windows-trial/*" "bundle/DMARC Monitor/" -Force

      # Authenticode. Without it Windows shows "Windows protected your PC" on
      # the first run of every download, and the way past it - More info, then
      # Run anyway - is indistinguishable from the advice somebody would be
      # given by malware. It is the single largest thing standing between this
      # and looking like software you bought.
      #
      # Deliberately inert until a certificate exists: no secret, no signing,
      # a notice in the log, and a release that still builds. See
      # docs/SIGNING.md for what to buy and what each option costs. When the
      # secrets are set this starts signing on the next tag with no code
      # change.
      - name: Is signing configured?
        id: signing
        shell: bash
        env:
          ENDPOINT: ${{ secrets.SIGNING_ENDPOINT }}
        run: |
          if [ -n "$ENDPOINT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned build::No signing certificate is configured, so this download will show a SmartScreen warning. See docs/SIGNING.md."
          fi

      - name: Sign
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\bundle\DMARC Monitor
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signature is one Windows will accept
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Signing that reports success and produces a signature the machine
          # does not trust is the failure worth catching here, because its
          # symptom downstream is identical to not signing at all.
          foreach ($exe in @('DmarcMonitor.Web.exe', 'dmarc.exe')) {
            $path = Join-Path "bundle/DMARC Monitor" $exe
            $sig = Get-AuthenticodeSignature $path
            "{0}: {1} ({2})" -f $exe, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { throw "$exe is signed but the signature is $($sig.Status)" }

            # A signature with no countersignature expires with the
            # certificate, and every copy already downloaded starts warning
            # again on that date.
            if (-not $sig.TimeStamperCertificate) { throw "$exe was signed without a timestamp" }
          }

      - name: The bundle carries what it needs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "bundle/DMARC Monitor"

          # Self-contained means the runtime is in the folder. If these are
          # missing the zip needs a .NET install after all, which is the one
          # thing this bundle exists to avoid - and it would only be found by
          # whoever downloaded it.
          foreach ($f in @('DmarcMonitor.Web.exe', 'dmarc.exe', 'README.txt',
                           'Start DMARC Monitor.cmd',
                           'hostfxr.dll', 'hostpolicy.dll', 'coreclr.dll',
                           'wwwroot/app.css')) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f is missing from the bundle" }
          }

          # The launcher decides what to run by name. A rename of the
          # executable that did not reach the .cmd would ship a bundle whose
          # one advertised action reports that the application is not there -
          # the exact failure it was written to explain.
          $launcher = Get-Content (Join-Path $dir 'Start DMARC Monitor.cmd') -Raw
          if ($launcher -notmatch [regex]::Escape('"DmarcMonitor.Web.exe" %*')) {
            throw 'the launcher does not start DmarcMonitor.Web.exe'
          }

          # And the note has to name the launcher, for the same reason.
          if ((Get-Content (Join-Path $dir 'README.txt') -Raw) -notmatch [regex]::Escape('Start DMARC Monitor.cmd')) {
            throw 'README.txt does not tell anybody what to double-click'
          }

          # And that nobody has to find the executable among five hundred DLLs
          # with the same icon: the one to double-click sorts to the top by
          # size and is the only .exe besides the command-line tool.
          (Get-ChildItem $dir -Filter *.exe).Name
          '{0:N0} files, {1:N0} MB' -f (Get-ChildItem $dir -Recurse -File).Count,
            ((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

          # That it starts and serves is asserted on every push, not only at
          # release time - see the "Windows trial download" job in tests.yml.

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "bundle/DMARC Monitor" -DestinationPath DMARC-Monitor-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dmarc-windows-trial
          path: DMARC-Monitor-Windows.zip
          if-no-files-found: error

  web:
    name: Web app bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: version
        run: |
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* || "$ref" == V* ]]; then
            number="${ref#[vV]}"

            # Refuse a tag that is not a version rather than stamping the
            # build with whatever was typed. dotnet takes -p:Version= on
            # trust, so "v1.0" or "vFinal" would either fail deep in the
            # build or produce a binary that misreports itself.
            if [[ ! "$number" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$ref' is not a version. Expected v1.2.3, so the build can be stamped with 1.2.3." >&2
              exit 64
            fi

            echo "number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "number=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: |
          dotnet publish src/DmarcMonitor.Web/DmarcMonitor.Web.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.number }} \
            --output publish/web

      - name: Say what this bundle is, inside the bundle
        run: |
          # This one has no .exe in it at all - it is framework-dependent and
          # was published without a runtime identifier, so its only apphost is
          # a Linux ELF binary. Downloaded on Windows by somebody looking for
          # the application, it is a folder of five hundred DLLs with nothing
          # to run, and that is exactly what happened. The name alone did not
          # carry it, so the bundle now says so from the inside.
          cp deploy/server-bundle/READ-ME-FIRST.txt publish/web/

      - name: Check the bundle carries what it needs
        run: |
          test -f publish/web/DmarcMonitor.Web.dll || { echo "no web assembly"; exit 1; }
          test -f publish/web/wwwroot/app.css     || { echo "no stylesheet: pages render unstyled"; exit 1; }
          test -f publish/web/READ-ME-FIRST.txt   || { echo "the bundle does not say what it is"; exit 1; }

          # A bundle that does not know its own version cannot tell a deployed
          # instance whether it is behind, which is the whole update story.
          grep -q "${{ steps.version.outputs.number }}" <(strings publish/web/DmarcMonitor.Core.dll) \
            || { echo "the build was not stamped with its version"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dmarc-web
          path: publish/web
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: [cli, web, trial]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          # The server never has a checkout - that is the point of releasing
          # artifacts - so the install, update and rollback scripts and the
          # systemd units travel with the release, or the docs tell somebody
          # to run a script they do not have.
          tar -czf dmarc-deploy.tar.gz deploy
          cd artifacts
          zip -r  ../dmarc-web.zip        dmarc-web
          mv dmarc-win-x64/dmarc.exe      ../dmarc.exe
          mv dmarc-linux-x64/dmarc        ../dmarc-linux-x64
          mv dmarc-linux-arm64/dmarc      ../dmarc-linux-arm64
          # Named for the person who needs it rather than for the build that
          # produced it, and capitalised so it sorts above the six lowercase
          # names it used to be lost among. The previous name was
          # dmarc-windows-trial.zip, sitting fifth in an alphabetical list
          # between dmarc-web.zip and dmarc.exe - and both of those were
          # downloaded first by somebody on Windows looking for the
          # application. One of them contains no Windows executable at all.
          mv dmarc-windows-trial/DMARC-Monitor-Windows.zip ../DMARC-Monitor-Windows.zip

      - name: Checksums
        run: |
          # Published so that "is this file what you built?" has an answer
          # that does not depend on a signature. Until the binaries are signed
          # this is the only thing somebody cautious can check, and it stays
          # useful afterwards.
          sha256sum \
            DMARC-Monitor-Windows.zip \
            dmarc.exe \
            dmarc-linux-x64 \
            dmarc-linux-arm64 \
            dmarc-web.zip \
            dmarc-deploy.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            DMARC-Monitor-Windows.zip
            dmarc.exe
            dmarc-linux-x64
            dmarc-linux-arm64
            dmarc-web.zip
            dmarc-deploy.tar.gz
            SHA256SUMS.txt
          body: |
            ## Want to look at it? Download `DMARC-Monitor-Windows.zip`

            That one, and none of the others. Right-click the .zip →
            Properties → tick **Unblock** → OK, *then* extract it, then
            double-click **`Start DMARC Monitor.cmd`**. A browser opens at
            `http://localhost:5000` and the dashboard is there.

            Nothing is installed: no .NET runtime, no administrator, no
            service, no server. It makes its own database in the folder,
            answers only that machine, and deleting the folder removes every
            trace. It is the same application a deployment runs, in local
            trial mode.

            Windows will say **"Windows protected your PC"** — click *More
            info*, then *Run anyway*. These binaries are not signed yet, and
            SmartScreen says that about every unsigned download. `SHA256SUMS.txt`
            is there if you would rather verify the file than trust it.

            ### The other files, and who they are for

            | file | for |
            |---|---|
            | `DMARC-Monitor-Windows.zip` | **trying it.** Self-contained, needs nothing installed |
            | `dmarc.exe` | the command-line tool, on its own. **Not the dashboard** — double-clicked it prints its help and exits |
            | `dmarc-linux-x64`, `dmarc-linux-arm64` | the same tool for a Linux server |
            | `dmarc-web.zip` | the **server** bundle. Needs the ASP.NET Core 8 runtime. **Contains no Windows executable** |
            | `dmarc-deploy.tar.gz` | install, update and rollback scripts, and the systemd units |

            `dmarc.exe` runs on its own: no .NET install, no checkout, no
            schema file beside it. Every build is checked by creating a
            database in an empty directory before it is published, on the
            architecture it targets.

            ### Installing on a server

            On a Linux server, unpack `dmarc-deploy.tar.gz` beside
            `dmarc-web.zip` and the Linux binary, and run
            `sudo ./deploy/install.sh` — or use the one-line bootstrap, which
            fetches all of it for you. See `docs/DEPLOYING.md` for the whole
            path, `docs/INGEST-SETUP.md` for the app registration and
            `docs/OPEN-ISSUES.md` for what is known to be unfinished.
