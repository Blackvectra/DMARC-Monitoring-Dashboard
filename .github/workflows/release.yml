name: Release

# Nothing downloadable existed: the CLI needed a git checkout and an SDK to
# run at all, which makes the first question anybody asks - "can I try it?" -
# a half-hour answer. This produces the two things somebody actually installs.
on:
  push:
    # Both cases. These filters are case-SENSITIVE, and a tag of V1.0.0
    # matched nothing at all: the release was created, said "Latest", and
    # carried no files, so every install command pointed at a 404. A tag
    # that silently produces an empty release is the worst shape this can
    # fail in, because the page looks right.
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write        # needed only to attach files to a release

jobs:
  cli:
    name: dmarc.exe (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is where an MSP runs this. Linux because the eventual
          # hosted deployment is a container, and finding out it does not
          # publish there at release time is finding out too late.
          - { os: windows-latest, rid: win-x64,     exe: dmarc.exe, runs: true }
          - { os: ubuntu-latest,  rid: linux-x64,   exe: dmarc,     runs: true }
          # ARM, because the cheapest instance at both AWS and Azure is one
          # (t4g, Dpsv5) and without this build there is nothing to put on it.
          # Cross-compiled from an x64 runner, so the binary cannot be executed
          # here to prove it works - see the architecture check below for what
          # is verified instead.
          - { os: ubuntu-latest,  rid: linux-arm64, exe: dmarc,     runs: false }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: version
        shell: bash
        run: |
          # The tag is the version. A manual run has no tag, so it gets one
          # that is obviously not a release rather than a plausible number.
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* || "$ref" == V* ]]; then
            number="${ref#[vV]}"

            # Refuse a tag that is not a version rather than stamping the
            # build with whatever was typed. dotnet takes -p:Version= on
            # trust, so "v1.0" or "vFinal" would either fail deep in the
            # build or produce a binary that misreports itself.
            if [[ ! "$number" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$ref' is not a version. Expected v1.2.3, so the build can be stamped with 1.2.3." >&2
              exit 64
            fi

            echo "number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "number=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: |
          # IncludeNativeLibrariesForSelfExtract puts e_sqlite3 inside the
          # binary rather than beside it. Without it the exe is not actually
          # one file, and somebody copies it alone and gets a runtime error
          # about a missing native library.
          dotnet publish src/DmarcMonitor.Cli/DmarcMonitor.Cli.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:Version=${{ steps.version.outputs.number }} \
            --output publish/${{ matrix.rid }}

      - name: Prove the single file actually runs on its own
        if: matrix.runs
        shell: bash
        run: |
          # The whole point of this job. Copy the binary somewhere with
          # nothing else in it - no schema file, no native library, no
          # checkout - and make it create a database. That is the first thing
          # anybody does with it, and the thing that breaks when the schema is
          # not embedded or SQLite did not get bundled.
          mkdir -p smoke
          cp publish/${{ matrix.rid }}/${{ matrix.exe }} smoke/
          cd smoke

          ls -la
          ./${{ matrix.exe }} init-db --db proof.db
          test -f proof.db || { echo "init-db reported success but wrote no database"; exit 1; }

          # And that it can read a report without a database or configuration.
          ./${{ matrix.exe }} explain ../src/DmarcMonitor.Core.Tests/Fixtures/google-aggregate.xml

      - name: Check the cross-compiled binary is for the architecture it claims
        if: ${{ !matrix.runs }}
        shell: bash
        run: |
          # It cannot be run here, so this is what is left: that a single file
          # exists, that it is an executable for the right machine, and that it
          # is big enough to be self-contained rather than a stub expecting a
          # runtime beside it. Short of executing it, which needs an ARM
          # runner, and worth saying plainly that this is weaker.
          binary=publish/${{ matrix.rid }}/${{ matrix.exe }}
          test -f "$binary" || { echo "nothing was published"; exit 1; }

          file "$binary"
          file "$binary" | grep -q "ARM aarch64" \
            || { echo "published binary is not an ARM executable"; exit 1; }

          size=$(stat -c%s "$binary")
          test "$size" -gt 20000000 \
            || { echo "only $size bytes: too small to be self-contained"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dmarc-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/${{ matrix.exe }}
          if-no-files-found: error

  web:
    name: Web app bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: version
        run: |
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* || "$ref" == V* ]]; then
            number="${ref#[vV]}"

            # Refuse a tag that is not a version rather than stamping the
            # build with whatever was typed. dotnet takes -p:Version= on
            # trust, so "v1.0" or "vFinal" would either fail deep in the
            # build or produce a binary that misreports itself.
            if [[ ! "$number" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$ref' is not a version. Expected v1.2.3, so the build can be stamped with 1.2.3." >&2
              exit 64
            fi

            echo "number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "number=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: |
          dotnet publish src/DmarcMonitor.Web/DmarcMonitor.Web.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.number }} \
            --output publish/web

      - name: Check the bundle carries what it needs
        run: |
          test -f publish/web/DmarcMonitor.Web.dll || { echo "no web assembly"; exit 1; }
          test -f publish/web/wwwroot/app.css     || { echo "no stylesheet: pages render unstyled"; exit 1; }

          # A bundle that does not know its own version cannot tell a deployed
          # instance whether it is behind, which is the whole update story.
          grep -q "${{ steps.version.outputs.number }}" <(strings publish/web/DmarcMonitor.Core.dll) \
            || { echo "the build was not stamped with its version"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dmarc-web
          path: publish/web
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: [cli, web]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          # The server never has a checkout - that is the point of releasing
          # artifacts - so the install, update and rollback scripts and the
          # systemd units travel with the release, or the docs tell somebody
          # to run a script they do not have.
          tar -czf dmarc-deploy.tar.gz deploy
          cd artifacts
          zip -r  ../dmarc-web.zip        dmarc-web
          mv dmarc-win-x64/dmarc.exe      ../dmarc.exe
          mv dmarc-linux-x64/dmarc        ../dmarc-linux-x64
          mv dmarc-linux-arm64/dmarc      ../dmarc-linux-arm64

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dmarc.exe
            dmarc-linux-x64
            dmarc-linux-arm64
            dmarc-web.zip
            dmarc-deploy.tar.gz
          body: |
            `dmarc.exe` runs on its own: no .NET install, no checkout, no
            schema file beside it. Every build is checked by creating a
            database in an empty directory before it is published.

            The web bundle needs the ASP.NET Core 8 runtime on the host.
            `dmarc-deploy.tar.gz` holds the install, update and rollback
            scripts and the systemd units; on a Linux server, unpack it beside
            the other two files and run `sudo ./deploy/install.sh`. See
            `docs/DEPLOYING.md` for the whole path, `docs/INGEST-SETUP.md`
            for the app registration and `docs/OPEN-ISSUES.md` for what is
            known to be unfinished.
